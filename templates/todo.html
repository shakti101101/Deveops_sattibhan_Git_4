<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
</head>
<body>
    <h2>Create a To-Do Item</h2>
    <form action="/submittodoitem" method="POST">
        <label for="item_name">Item Name:</label>
        <input type="text" id="item_name" name="item_name" required>

        <label for="item_description">Item Description:</label>
        <textarea id="item_description" name="item_description" required></textarea>

        <button type="submit">Submit</button>
    </form>

    <h2>Saved To-Do Items</h2>
    <ul id="todo-list"></ul>

    <script>
        async function loadItems() {
            const response = await fetch("/gettodoitems");
            const items = await response.json();

            const list = document.getElementById("todo-list");
            list.innerHTML = "";

            items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = `${item.itemName}: ${item.itemDescription}`;
                list.appendChild(li);
            });
        }
        window.onload = loadItems;
    </script>
</body>
</html>
